<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom HA Cards — Playground</title>
    <script type="module" src="/playground/main.ts"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --card-background-color: #1e293b;
        --primary-background-color: #0f172a;
        --secondary-background-color: rgba(255, 255, 255, 0.06);
        --primary-text-color: #f1f5f9;
        --secondary-text-color: #94a3b8;
        --disabled-text-color: #64748b;
        --primary-color: #38bdf8;
        --error-color: #f87171;
        --ha-card-border-radius: 12px;
        --ha-card-box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        --text-primary-color: #0f172a;
        color-scheme: dark;
      }

      :root.light {
        --card-background-color: #ffffff;
        --primary-background-color: #f1f5f9;
        --secondary-background-color: rgba(0, 0, 0, 0.05);
        --primary-text-color: #0f172a;
        --secondary-text-color: #64748b;
        --disabled-text-color: #94a3b8;
        --primary-color: #0284c7;
        --error-color: #dc2626;
        --text-primary-color: #ffffff;
        color-scheme: light;
      }

      body {
        margin: 0;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        transition:
          background 0.2s,
          color 0.2s;
      }

      #pg-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--card-background-color);
        border-bottom: 1px solid rgba(128, 128, 128, 0.15);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }

      #pg-header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        flex: 1;
        color: var(--primary-text-color);
      }

      #pg-header .badge {
        font-size: 0.72rem;
        background: var(--secondary-background-color);
        color: var(--secondary-text-color);
        padding: 3px 8px;
        border-radius: 999px;
      }

      #pg-theme-toggle {
        background: var(--secondary-background-color);
        border: none;
        color: var(--secondary-text-color);
        font: inherit;
        font-size: 0.8rem;
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      #pg-theme-toggle:hover {
        background: rgba(128, 128, 128, 0.15);
      }

      #app {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .pg-section {
        margin-bottom: 32px;
      }

      .pg-section-title {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--secondary-text-color);
        margin: 0 0 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(128, 128, 128, 0.15);
      }

      .pg-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }

      .pg-grid.wide {
        grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      }

      .pg-card-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .pg-card-label {
        font-size: 0.68rem;
        color: var(--disabled-text-color);
        font-family: 'SF Mono', 'Fira Code', monospace;
        padding: 0 2px;
      }
    </style>
  </head>
  <body>
    <div id="pg-header">
      <h1>Custom HA Cards</h1>
      <span class="badge">Playground</span>
      <button id="pg-theme-toggle">Light mode</button>
    </div>
    <div id="app"></div>

    <script>
      document.getElementById('pg-theme-toggle').addEventListener('click', function () {
        const isLight = document.documentElement.classList.toggle('light');
        this.textContent = isLight ? 'Dark mode' : 'Light mode';
      });
    </script>
  </body>
</html>
